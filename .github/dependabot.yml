# Dependency updates (NFR-6). PRs go through the normal automated PR gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      js-minor-patch:
        update-types: [minor, patch]
        exclude-patterns:
          [
            'expo',
            'expo-*',
            '@expo/*',
            'react-native',
            'react-native-*',
            '@react-native/*',
            'jest-expo',
          ]
      expo-sdk:
        patterns:
          [
            'expo',
            'expo-*',
            '@expo/*',
            'react-native',
            'react-native-*',
            '@react-native/*',
            'jest-expo',
          ]
        update-types: [patch]
    ignore:
      # Expo SDK upgrades move these in lockstep; the mobile agent does them with `expo install --fix`.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # React must match the version bundled by the Expo SDK.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # @playwright/test is pinned to the browser build used by CI images; bump deliberately.
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    ignore:
      # Runtime majors (Python 3.12, Node 22) are fixed by the spec; bump deliberately.
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
