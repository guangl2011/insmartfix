# Nightly on main (DEVELOPMENT_PROCESS §3, TEST_PLAN §2): full web E2E + visual regression,
# Android emulator and iOS simulator (Maestro), k6 load, OWASP ZAP baseline.
# A failure of a gating job opens/updates a GitHub issue labeled `regression`.
name: Nightly

on:
  schedule:
    - cron: '17 7 * * *' # 07:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  MAESTRO_VERSION: '2.12.1'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  web-e2e-full:
    name: Web E2E full + visual regression · Playwright vs compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_EXPECT_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @insmartfix/web...
      - name: Start the stack
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300
          make seed
      - id: pw
        run: echo "version=$(pnpm --filter @insmartfix/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @insmartfix/web exec playwright install --with-deps chromium webkit
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @insmartfix/web exec playwright install-deps chromium webkit
      # Full suite on all projects. Visual-regression specs (toHaveScreenshot, light + dark) join
      # this run as they land in M4; baselines are approved at G2 (TEST_PLAN §8.5).
      - name: Playwright full suite (Pixel 7, iPhone 14, desktop)
        run: pnpm --filter @insmartfix/web exec playwright test --update-snapshots=none
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-nightly-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  android:
    name: Android · emulator API 34 + Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # NOT GATING until M5 lands (mobile feature flows + a stable release build). Remove this
    # continue-on-error when M5 merges so Android failures open a `regression` issue.
    continue-on-error: true
    env:
      EXPO_PUBLIC_DATA_SOURCE: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @insmartfix/mobile...
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Assemble release APK (JS bundled, debug-signed for the emulator)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64
      - name: Create AVD snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Maestro on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/e2e --format junit --output maestro-android.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maestro-android
          path: |
            maestro-android.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  ios:
    name: iOS · simulator + Maestro
    runs-on: macos-latest
    timeout-minutes: 90
    # NOT GATING until M5 lands (mobile feature flows + a stable release build). Remove this
    # continue-on-error when M5 merges so iOS failures open a `regression` issue.
    continue-on-error: true
    env:
      EXPO_PUBLIC_DATA_SOURCE: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @insmartfix/mobile...
      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: pods-${{ runner.os }}-
      - name: pod install
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build for the simulator (Release, unsigned)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace InsmartFix.xcworkspace -scheme InsmartFix -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Boot a simulator (iPhone 15 per TEST_PLAN, else the newest available iPhone)
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))]
            | (map(select(.name == "iPhone 15")) + .) | .[0].udid')
          echo "Booting $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" apps/mobile/ios/build/Build/Products/Release-iphonesimulator/InsmartFix.app
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Maestro on the simulator
        env:
          # The XCTest driver needs longer than Maestro's default to start on a cold hosted runner
          # (first nightly failed with "iOS driver not ready in time").
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: maestro test apps/mobile/e2e --format junit --output maestro-ios.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maestro-ios
          path: |
            maestro-ios.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  k6:
    name: k6 load (T-PERF-1) · staging, or the compose stack until staging exists
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Repository variable STAGING_API_URL is set once staging exists (spec D8). Until then the
      # job exercises the compose stack for a shorter run so the script and thresholds stay honest.
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start API stack (no staging configured)
        if: env.STAGING_API_URL == ''
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300 api
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: k6 run
        env:
          BASE_URL: ${{ env.STAGING_API_URL || 'http://localhost:8000' }}
          DURATION: ${{ env.STAGING_API_URL != '' && '10m' || '2m' }}
        run: k6 run -e BASE_URL="$BASE_URL" -e RATE=50 -e DURATION="$DURATION" infra/k6/api-load.js

  zap-baseline:
    name: OWASP ZAP baseline · web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300 web
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_WEB_URL || 'http://localhost:3000' }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: Fail on High-risk findings (TEST_PLAN §8.4)
        run: |
          HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' report_json.json)
          echo "ZAP high-risk alerts: $HIGH" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$HIGH" -eq 0

  report-regression:
    name: Open regression issue on failure
    needs: [web-e2e-full, android, ios, k6, zap-baseline]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          gh label create regression --color B60205 --description "Nightly failure on main" --force
          TITLE="Nightly regression on main ($(date -u +%F))"
          BODY=$(printf 'Nightly run failed: %s\n\nJob results:\n```json\n%s\n```\n\nOwning agent fixes this before the next milestone starts (DEVELOPMENT_PROCESS §3).' "$RUN_URL" "$RESULTS")
          EXISTING=$(gh issue list --label regression --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --label regression --body "$BODY"; fi
