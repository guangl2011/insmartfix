# Per-PR gate (DEVELOPMENT_PROCESS §2, TEST_PLAN §2/§4). `ci-ok` is the single required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  UV_VERSION: '0.11.32'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'

jobs:
  api:
    name: API · lint, types, unit + integration, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: insmartfix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d insmartfix_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-only
          MINIO_DEFAULT_BUCKETS: insmartfix-test
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: ruff (lint + format)
        run: uv run ruff check --output-format=github . && uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Create the runtime DB role (D10 H-5; the migrations grant it least privilege)
        env:
          PGPASSWORD: ci-only
        run: >-
          psql -h localhost -U ci -d insmartfix_test -v ON_ERROR_STOP=1 -c
          "CREATE ROLE insmartfix_app LOGIN NOSUPERUSER NOCREATEROLE NOCREATEDB NOBYPASSRLS
          PASSWORD 'ci-app-only'"
      - name: pytest (unit + integration against Postgres 16 + MinIO)
        env:
          ENV: ci
          # The app runs as the runtime role; the tests migrate as the owner (T-MEM-1, T-MEM-2).
          DATABASE_URL: postgresql+psycopg://insmartfix_app:ci-app-only@localhost:5432/insmartfix_test
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://ci:ci-only@localhost:5432/insmartfix_test
          REQUIRE_INTEGRATION: '1'
          S3_ENDPOINT_URL: http://localhost:9000
          S3_BUCKET: insmartfix-test
          S3_ACCESS_KEY_ID: ci-minio
          S3_SECRET_ACCESS_KEY: ci-minio-only
        run: uv run pytest --cov --cov-report=term --cov-report=json --cov-report=xml --junitxml=test-results/junit-api.xml
      - name: Alembic migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://insmartfix_app:ci-app-only@localhost:5432/insmartfix_test
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://ci:ci-only@localhost:5432/insmartfix_test
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: Coverage thresholds (TEST_PLAN §4)
        run: |
          set -o pipefail
          { echo '### API coverage (TEST_PLAN §4)'; echo '```'; uv run python scripts/check_coverage.py coverage.json; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-api
          path: apps/api/coverage.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-api
          path: apps/api/test-results
          if-no-files-found: ignore

  js:
    name: JS · lint, types, unit, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-js-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-js-${{ runner.os }}-
      - name: eslint (incl. NFR-4 status-color rule) + tsc
        run: pnpm turbo run lint typecheck
      - name: prettier
        run: pnpm exec prettier --check .
      # JUnit (vitest) and jest JSON results feed the spec-conformance job.
      - name: Unit tests with coverage thresholds (vitest)
        run: >-
          pnpm turbo run test:coverage --filter=!@insmartfix/mobile --
          --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Unit tests with coverage thresholds (jest)
        run: |
          mkdir -p apps/mobile/test-results  # jest doesn't create the --outputFile directory
          pnpm turbo run test:coverage --filter=@insmartfix/mobile -- \
            --json --outputFile=test-results/jest.json
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-js
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-js
          path: |
            apps/*/test-results/*.xml
            apps/*/test-results/*.json
            packages/*/test-results/*.xml
            tools/*/test-results/*.xml
          if-no-files-found: ignore

  contracts:
    name: Contract drift (openapi.json + TS types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile --filter @insmartfix/contracts
      - run: uv sync --frozen --directory apps/api
      - name: Regenerate and diff (fails if the committed contract drifted from the API)
        run: pnpm --filter @insmartfix/contracts run check
      - name: Breaking-change check vs the base branch (oasdiff; /v1 is additive-only)
        if: github.event_name == 'pull_request'
        env:
          OASDIFF_VERSION: '1.35.0'
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git show "origin/$BASE_REF:packages/contracts/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "No openapi.json on $BASE_REF yet; nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsSL -o /tmp/oasdiff.tgz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tgz -C /tmp oasdiff
          /tmp/oasdiff breaking /tmp/base-openapi.json packages/contracts/openapi.json --fail-on ERR

  build:
    name: Build · web, mobile bundle, Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build web (Next.js) and bundle mobile JS (expo export android + ios)
        run: pnpm turbo run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker image · api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          push: false
          load: true
          tags: insmartfix-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: API image has no test-clock package (D10 H-7, T-AUTH-18 image half)
        run: |
          if docker run --rm insmartfix-api:ci python -c "import app.testing"; then
            echo "::error::app.testing is importable in the API image"; exit 1
          fi
          docker run --rm insmartfix-api:ci python -c "import app.main"
      - name: Docker image · web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: insmartfix-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  security:
    name: Security · gitleaks, pip-audit, pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner -v .
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: pip-audit (locked API dependencies, all groups)
        working-directory: apps/api
        run: |
          uv export --frozen --format requirements-txt --no-emit-project --all-groups -o /tmp/requirements.txt
          uvx pip-audit==2.10.0 -r /tmp/requirements.txt --disable-pip --require-hashes --strict --progress-spinner off
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (fail on high/critical — TEST_PLAN §4)
        run: pnpm audit --audit-level high

  e2e-smoke:
    name: Web E2E smoke · Playwright vs compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_EXPECT_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @insmartfix/web...
      - name: Start the stack (postgres, minio, migrate, api, web, toxiproxy)
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Seed (stub until M1)
        run: make seed
      - id: pw
        run: echo "version=$(pnpm --filter @insmartfix/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers (Chromium for Pixel 7/desktop, WebKit for iPhone 14)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @insmartfix/web exec playwright install --with-deps chromium webkit
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @insmartfix/web exec playwright install-deps chromium webkit
      - name: Playwright smoke (Pixel 7, iPhone 14, desktop)
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/pw-results/junit-playwright.xml
        run: pnpm --filter @insmartfix/web exec playwright test --grep @smoke --reporter=list,html,github,junit
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-smoke-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-e2e-smoke
          path: pw-results
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  spec-conformance:
    # DEVELOPMENT_PROCESS §2 step 5: every T-ID in the PR body names a real test that passed in
    # this run, and every FR/NFR ID is in the spec. A body with no T-IDs passes with a note.
    name: Spec conformance (PR body vs test results)
    if: always()
    needs: [api, js, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: test-results
      - name: Fetch the current PR body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The live body, so a corrected description counts on re-run; the event copy otherwise.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md" \
            || printf '%s' "$EVENT_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: Check requirement and test IDs
        run: |
          touch "$RUNNER_TEMP/pr-body.md"
          node tools/spec-conformance/check.ts --body-file "$RUNNER_TEMP/pr-body.md" --results test-results

  ci-ok:
    name: ci-ok
    if: always()
    needs: [api, js, contracts, build, security, e2e-smoke, spec-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")' > /dev/null
