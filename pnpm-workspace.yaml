packages:
  - apps/web
  - apps/mobile
  - packages/*
  - tools/*

# Native/postinstall builds we allow (pnpm 10 blocks lifecycle scripts by default).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security overrides (CI gate: 0 high/critical vulnerable dependencies, TEST_PLAN §4).
# next@15.5 pins postcss 8.4.31 (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849); drop when next ships a fix.
overrides:
  next>postcss: 8.5.32
