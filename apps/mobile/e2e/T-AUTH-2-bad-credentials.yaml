# T-AUTH-2 (D I): bad credentials → inline error, fields kept. The mock rejects "wrong-password".
appId: ai.insmart.fix
name: T-AUTH-2 bad credentials show an inline error
tags:
  - T-AUTH-2
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: 'login-email'
    timeout: 60000
- tapOn:
    id: 'login-email'
- inputText: marco@test.insmart.ai
- tapOn:
    id: 'login-password'
- inputText: wrong-password
- hideKeyboard
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: 'Email or password is incorrect'
    timeout: 20000
- assertVisible: 'marco@test.insmart.ai'
- takeScreenshot: T-AUTH-2-error
