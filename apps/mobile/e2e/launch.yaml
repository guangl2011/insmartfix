# Launch smoke: the app cold-starts into the shell (DATA_SOURCE=mock in the nightly job).
# Run: maestro test apps/mobile/e2e   (needs a booted emulator/simulator with the app installed)
appId: ai.insmart.fix
name: Launch smoke
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'nav-inbox'
    timeout: 60000
- takeScreenshot: launch
