# Launch smoke: a fresh install cold-starts into Login (DATA_SOURCE=mock in the nightly job).
# Run: maestro test apps/mobile/e2e   (needs a booted emulator/simulator with the app installed)
appId: ai.insmart.fix
name: Launch smoke
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: 'Jobs that arrive diagnosed.'
    timeout: 60000
- takeScreenshot: launch-login
