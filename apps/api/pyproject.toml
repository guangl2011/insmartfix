[project]
name = "insmartfix-api"
version = "0.0.0"
description = "InsmartFix backend API (FastAPI) — implements docs/specs/INSMARTFIX_V1_SPEC.md §5."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "schemathesis==4.33.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real Postgres at DATABASE_URL (run in CI and against the compose stack)",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.isort]
# apps/api/alembic/ is the migrations dir; the `alembic` import is always the library.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests are named by TEST_PLAN ID (`test_T_MEM_2_...`, CLAUDE.md conventions).
"tests/**" = ["S101", "S105", "S106", "N802", "N999"]
"scripts/**" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]
